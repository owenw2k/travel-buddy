name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.strict-peer-dependencies=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Start server
        run: |
          pnpm start &
          until curl -sf http://localhost:3000; do sleep 1; done

      - name: PR Screenshots
        uses: owenw2k/screenshot-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.pull_request.number }}
          install-command: pnpm install --frozen-lockfile
          build-command: pnpm build
          serve-command: pnpm start
          dark-mode-toggle-label: "switch to dark mode"

      - name: Stop server
        if: always()
        run: fuser -k 3000/tcp 2>/dev/null || true
